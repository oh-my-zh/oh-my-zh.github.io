<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{TITLE}} —— {{SITE_NAME}}的一篇作品。">
    <title>{{TITLE}} · {{SITE_NAME}}</title>
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/style.css?v=20261009">
  </head>
  <body class="work">
    <header class="site-header">
      <a class="site-title" href="../index.html">{{SITE_NAME}}</a>
      <nav aria-label="主导航">
        <a href="../index.html">首页</a>
        <a href="../index.html#categories">分类</a>
      </nav>
    </header>

    <main>
      <article class="work-page">
        <nav class="breadcrumb" aria-label="面包屑">
          <a href="../index.html">← 返回首页</a>
        </nav>

        <header class="work-header">
          <span class="work-meta">
            <span class="work-date">{{DATE}}</span>
            <a class="work-cat" href="../index.html#{{CAT_ANCHOR}}">{{CATEGORY}}</a>
          </span>
          <h1>{{TITLE}}</h1>
          <p class="work-summary">{{SUMMARY}}</p>
        </header>

        <div class="prose">
{{CONTENT}}
        </div>

        <section class="content-section" id="comment">
          <h2>留言评论</h2>
          <p class="comment-hint">关于这篇作品的想法，评论会直接发到我的邮箱。</p>
          <form class="comment-form" id="comment-form" novalidate>
            <div class="comment-row">
              <div class="comment-field">
                <label for="comment-name">昵称</label>
                <input type="text" id="comment-name" name="name" placeholder="怎么称呼你（可选）" autocomplete="nickname">
              </div>
              <div class="comment-field">
                <label for="comment-email">邮箱</label>
                <input type="email" id="comment-email" name="email" placeholder="你的邮箱（可选，便于我回复）" autocomplete="email">
              </div>
            </div>
            <div class="comment-field">
              <label for="comment-message">评论内容</label>
              <textarea id="comment-message" name="message" rows="8" placeholder="写下你的想法……" required></textarea>
            </div>
            <input type="checkbox" name="botcheck" class="comment-hp" tabindex="-1" autocomplete="off">
            <button type="submit" class="comment-submit">发送评论</button>
            <p class="comment-status" role="status" aria-live="polite"></p>
          </form>
        </section>
      </article>
    </main>

    <footer class="site-footer">
      © 2026 {{SITE_NAME}}
    </footer>

    <script src="../assets/comment.js" defer></script>
  </body>
</html>
