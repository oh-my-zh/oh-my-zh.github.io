name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    # 每 30 分钟自动拉取一次评论并部署（UTC 时间）
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # 需要写权限，用于把 comments/comments.json 提交回仓库
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch comments from mailbox
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/fetch_comments.py

      - name: Commit comments
        run: |
          if [ -f comments/comments.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add comments/comments.json
            if git diff --cached --quiet; then
              echo "无新评论，跳过提交"
            else
              git commit -m "chore: 更新评论数据"
              git push
            fi
          fi

      - name: Build site
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
